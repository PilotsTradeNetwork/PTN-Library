[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm[toml] >= 6"]
build-backend = "setuptools.build_meta"

[project]
name = "PTN-Utils"
description = "Common utilities for multiple PTN Bots"
authors = [
    { name = "Conshmea"},
    { name = "Axle Antilles"},
    { name = "IndorilReborn"}
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "discord-py>=2.0",
    "python-dotenv>=0.15.0",
    "loguru>=0.7.3",
]
dynamic = ["version"]

[tool.setuptools_scm]
# this is used populated when creating a git archive
# and when there is .git dir and/or there is no git installed
fallback_version = "9999.$Format:%h-%cs$"

[tool.setuptools.packages.find]
where = ["."]
include = ["ptn_utils*"]
