[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PTN-Utils"
version = "0.2.3"
description = "Common utilities for multiple PTN Bots"
authors = [
    { name = "Conshmea"},
    { name = "Axle Antilles"},
    { name = "IndorilReborn"}
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "discord-py>=2.0",
    "python-dotenv>=0.15.0",
    "loguru>=0.7.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ptn_utils*"]
